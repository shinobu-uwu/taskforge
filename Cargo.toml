[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
circular-buffer = "2.0.0"
gpui = { git = "https://github.com/zed-industries/zed", features = ["wayland"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }
rust-embed = "8.12.0"
serde = { version = "1", features = ["derive"] }
sysinfo = "0.39.6"
thiserror = "2"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = "0.3"

[workspace.dependencies.gpui_platform]
git = "https://github.com/zed-industries/zed"
features = ["font-kit", "wayland"]

[workspace.metadata.crane]
name = "taskforge"

[profile.release]
opt-level = 3
strip = true
lto = "fat"
panic = "abort"
codegen-units = 1
