[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
circular-buffer = "2.0.0"
gpui = { git = "https://github.com/zed-industries/zed", features = ["wayland"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }
iced = "0.14"
iced_fonts = "0.3"
open = "5.4.1"
rust-embed = "8.12.0"
serde = { version = "1", features = ["derive"] }
sysinfo = "0.39.6"
thiserror = "2"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = "0.3"

[workspace.dependencies.gpui_platform]
git = "https://github.com/zed-industries/zed"
features = ["font-kit", "wayland"]

[workspace.metadata.crane]
name = "taskforge"

[profile.dev]
opt-level = 0
split-debuginfo = "unpacked"
lto = false
incremental = true

[profile.release]
debug = 1
split-debuginfo = "packed"  # generates a separate *.dwp/*.dSYM so the binary can get stripped
strip = "symbols"  # See split-debuginfo - allows us to drop the size by ~65%
lto = true
panic = "abort"  # reduces binary size by ~50% in combination with -Zbuild-std-features=panic_immediate_abort
incremental = false
codegen-units = 1
